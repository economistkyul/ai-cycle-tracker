version: 2
# 모든 provisional: true 임계값은 백테스트로 조정 전까지 잠정값이다.

primary:
  us10y:
    name: "미 10Y 국채금리"
    unit: "pct"
    fire_threshold: 5.0        # 구 trigger_zone 하단 — 발화 임계
    severity_threshold: 5.3    # 구 trigger_zone 상단 — 심화 판정 (v1에서 미사용이던 값)
    clear_threshold: 4.70      # hysteresis: 발화 후 이 값 이하 확인 시에만 해제
    confirm_obs: 3             # 연속 관측 확인 횟수 (일일 지표)
    clear_confirm_obs: 2
    armed_proximity: 0.95
    stale_after_days: 10
    provisional: true
  core_cpi:
    name: "미 Core CPI (YoY)"
    unit: "pct"
    fire_threshold: 3.0
    severity_threshold: 3.3
    clear_threshold: 2.80
    confirm_obs: 2             # 월간 지표 — 2회 연속 상회
    clear_confirm_obs: 1
    armed_proximity: 0.95
    stale_after_days: 45
    provisional: true

dual_condition_required: true   # 두 primary 모두 FIRED → macro FIRED

rate_velocity:
  name: "금리 상승 속도"
  window_obs: 4
  fast_rise_bp: 40             # 4관측 내 +40bp → macro stress 가중
  provisional: true

secondary:
  fed_bias:      { name: "Fed 정책 편향", role: "modifier" }
  core_ex_shelter_cpi: { name: "Core ex-shelter CPI", role: "leading_indicator", stale_after_days: 45 }
  geopolitics:   { name: "이란/호르무즈", role: "swing_variable" }
  hy_spread:     { name: "하이일드 스프레드", unit: "bp", role: "credit", stale_after_days: 10 }

emergency_override:
  description: >
    금리 하락형 붕괴 대응 — 듀얼 매크로 트리거와 무관하게 EXITING 허용.
    (금리가 내려도 EPS 급락 + 신용 악화 + 추세 붕괴가 동반되면 발동)
  conditions_all:
    forward_eps_3m_change_pct: { op: "<=", value: -5.0 }
    hy_spread_widening_bp_20d: { op: ">=", value: 150 }
    technical_regime:          { op: "==", value: "TREND_BREAK" }
  provisional: true

krw_signal:
  name: "원화 3단계 시그널"
  # v2: stage는 수기 입력이 아니라 구성 지표에서 유도. 수기 입력은 override로만 취급하고
  #     유도값과 모순 시 경고를 발생시킨다.
  derivation:
    stage1: "usdkrw_trend == 'stable_or_strengthening'"
    stage2: "stage1 AND kr_earnings_revision_trend == 'decelerating'"
    stage3: "usdkrw_trend == 'weakening' AND foreign_net_flow == 'selling'"
  stages:
    stage1: { state: "원화 안정화", action: "보유/확대" }
    stage2: { state: "원화 강세 + 이익수정 둔화", action: "경계 상향" }
    stage3: { state: "원화 반전 + 외인 순매도", action: "한국 포지션 선행 매도" }

states: { CLEAR: "미발화", ARMED: "임계 근접", FIRED: "발화", UNKNOWN: "데이터 누락/노후" }
