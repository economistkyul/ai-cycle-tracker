name: weekly-signal-check
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 0 * * 6"
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python src/signals/dashboard.py
